# Local development services for ProcureLake.
# Usage (from repo root): make db-up  /  make db-down
name: procurelake

services:
  postgres:
    # Pinned to the same major version as the planned RDS source (ADR 0015).
    image: postgres:17.11
    container_name: procurelake-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    # Logical decoding enabled locally so CDC behaviour can be exercised before RDS/DMS (Week 5).
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - procurelake_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  procurelake_pgdata:
