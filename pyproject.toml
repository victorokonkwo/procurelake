[project]
name = "procurelake"
version = "0.1.0"
description = "ProcureLake: Enterprise Procurement Intelligence & AI Data Platform"
readme = "README.md"
# Matches the AWS Glue 5.1 runtime (Python 3.11). See docs/adr/0015-runtime-versions.md.
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.43.127",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurelake"]

[dependency-groups]
dev = [
    "moto>=5.2.5",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-httpserver>=1.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "scripts", "tests", "database"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; test DSNs/passwords are local-only fixtures; seeded random is fine in tests.
"**/tests/**" = ["S101", "S105", "S106", "S311"]
# Athena queries in integration tests are built from module constants and values checked by
# _lit() against strict patterns (tests/integration/aws/test_bronze_queryable.py).
"tests/integration/**" = ["S101", "S105", "S106", "S311", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests", "database/postgres/tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires the local PostgreSQL service (make db-up) and PROCURELAKE_PG_DSN",
    "aws: integration tests against the deployed dev AWS environment (opt-in: make test-aws)",
]
