[project]
name = "procurelake"
version = "0.1.0"
description = "ProcureLake: Enterprise Procurement Intelligence & AI Data Platform"
readme = "README.md"
# Matches the AWS Glue 5.1 runtime (Python 3.11). See docs/adr/0015-runtime-versions.md.
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.43.127",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurelake"]

# Ship the contracts and Silver pipeline configs inside the wheel, so a deployed job always
# applies the rules of the same commit (procurelake.lakehouse.silver.job.resource_root).
[tool.hatch.build.targets.wheel.force-include]
"contracts/source" = "procurelake/_bundled/contracts/source"
"configs/pipelines/silver" = "procurelake/_bundled/configs/pipelines/silver"

[dependency-groups]
dev = [
    "moto>=5.2.5",
    "pre-commit>=4.7.0",
    "pyarrow==26.0.1",
    "pyspark==3.5.8",
    "pytest>=9.2.0",
    "pytest-httpserver>=1.2.0",
    "ruff>=0.17.4",
]
# dbt Gold project (ADR 0026), outside the Glue wheel: `uv sync --group dbt` (make dbt-* targets).
dbt = [
    "dbt-core==1.12.6",
    "dbt-athena==1.11.1",
]
# AI contract extraction (Week 9, ADR 0032), outside the Glue wheel: `uv sync --group ai`
# (make ai-* targets). Pinned to releases at least two weeks old when chosen.
ai = [
    "anthropic[bedrock]==2.3.0",
    "pypdf==6.21.4",
]

# `uv sync` installs dev and ai by default, so unit tests (including tests/unit/ai) run after a
# plain sync, locally and in CI. dbt stays opt-in (`uv sync --group dbt`).
[tool.uv]
default-groups = ["dev", "ai"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "scripts", "tests", "database"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; test DSNs/passwords are local-only fixtures; seeded random is fine in tests.
"**/tests/**" = ["S101", "S105", "S106", "S311"]
# Athena queries in integration tests are built from module constants and values checked by
# _lit() against strict patterns (tests/integration/aws/test_bronze_queryable.py).
"tests/integration/**" = ["S101", "S105", "S106", "S311", "S608"]
# The same for the acceptance tiers (plan §3): Athena and Spark SQL from Terraform outputs,
# contract identifiers and module constants.
"tests/{e2e,security,performance}/**" = ["S101", "S105", "S106", "S311", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests", "database/postgres/tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires the local PostgreSQL service (make db-up) and PROCURELAKE_PG_DSN",
    "aws: integration tests against the deployed dev AWS environment (opt-in: make test-aws)",
    "spark: local Spark 3.5.8 + Iceberg 1.10.0 tests (need Java 17; first run downloads the Iceberg runtime)",
]
