# Security scanners (ADR 0037): Terraform (Checkov), Python dependencies (pip-audit) and
# secrets in the full git history (gitleaks). No AWS credentials. Runs weekly too, because new
# advisories appear without any code change.
name: ci-security

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    name: terraform (checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"
      # Waivers: repository-wide in .checkov.yaml, per resource as `checkov:skip` comments.
      - run: uvx --from checkov==3.3.30 checkov --config-file .checkov.yaml

  dependencies:
    name: python dependencies (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"
      # Every group in uv.lock (runtime, dev, dbt, ai), hash-checked; nothing is installed.
      - run: uv export --frozen --all-groups --no-emit-project -o "$RUNNER_TEMP/requirements.txt" >/dev/null
      - run: uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes --progress-spinner off

  secrets:
    name: secrets in git history (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # From gitleaks_8.30.1_checksums.txt (release v8.30.1), checked 2026-11-11.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, not just the tip
      - name: install gitleaks (pinned, checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      # Reviewed false positives are listed by fingerprint in .gitleaksignore.
      - run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner'
