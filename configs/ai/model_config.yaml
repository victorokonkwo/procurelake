# Bedrock model configuration for contract extraction (ADR 0032; open question 18, decided by
# the owner on 2026-11-11: Claude Haiku 5.5 through the Canada inference profile).
config_version: 1
provider: amazon_bedrock
region: ca-central-1
# Canada cross-region inference profile: routes to ca-central-1 and ca-west-1 only, so
# document text is processed in Canada (ADR 0001). Listed with `aws bedrock
# list-inference-profiles` on 2026-11-11.
model_id: ca.anthropic.claude-haiku-5-5
foundation_model: anthropic.claude-haiku-5-5
effort: medium
max_tokens: 16000
prompt_file: prompts/contract_extraction_v1.md
prompt_version: contract_extraction_v1
schema_version: contract_extraction.v1
# Documents are sent whole (Haiku 5.5 has a 1M-token context). A document over this many pages
# is refused rather than truncated.
max_pages: 80
text:
  min_words_per_page: 15  # below this, the page is OCR'd with Textract
# List prices (USD per million tokens) from the AWS Marketplace offer on the model agreement,
# rate card dimension CAN1_*_standard (Canada geography), read 2026-11-11. Used only to turn
# measured token counts into a cost estimate; the bill is the source of truth. The estimate
# applies the long-context rates to the whole request when its input exceeds the threshold (an
# assumption; the rate card names the rates, not how a request is split).
pricing_usd_per_million_tokens:
  input: 0.11
  output: 0.55
  input_long_context: 0.55
  output_long_context: 2.75
  long_context_threshold_input_tokens: 100000
# Every document goes to human review in this version. Turning this on would need measured
# evaluation results that justify it (ADR 0032).
auto_approve: false
