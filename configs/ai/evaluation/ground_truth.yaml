# Ground-truth labels for the contract extraction evaluation (ADR 0032). Drafted by reading each
# PDF page by page (pdftotext text layer; scanned or image-only pages rendered with pdftoppm and
# read as images), recording only what the document itself prints, under the rules of
# prompts/contract_extraction_v1.md.
#
# Owner check, 2026-11-11: the owner settled the six judgement calls the drafter raised by
# accepting the assistant's proposed resolutions (contractor/issuer not printed in a block ->
# empty; a modification's amount is its change; "See Block 16C/20C" and "Date of Order" count as
# the effective date; one-CLIN description counts as category, several CLINs do not;
# handwritten dates as read). This was a decision on rules, not a page-by-page re-read of every
# label: results must be reported with that caveat.
