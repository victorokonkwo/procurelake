# Install once with: uv run pre-commit install
# Run on everything with: uv run pre-commit run --all-files
# Installs both the pre-commit and the commit-msg hook (rejects AI attribution in messages).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # Terraform template with an unquoted list placeholder; rendered and checked in
        # tests/unit/orchestration/test_tenant_exports_asl.py instead.
        exclude: ^orchestration/step_functions/tenant_exports\.asl\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive infrastructure
        language: system
        pass_filenames: false
        files: \.(tf|tftest\.hcl)$
      - id: no-ai-attribution
        name: no AI attribution in commit messages
        entry: python3 scripts/git/check_commit_msg.py
        language: system
        stages: [commit-msg]
